<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hum Runner</title>
<meta name="description" content="Control the game with your voice. Hum high to climb, hum low to drop.">
<meta name="theme-color" content="#1d1147">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="Hum Runner: play with your voice 🎤">
<meta property="og:description" content="Hum to fly through the gaps. How far can your voice go?">
<meta property="og:url" content="https://hum-runner.netlify.app/">
<meta property="og:image" content="https://hum-runner.netlify.app/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="Hum Runner: play with your voice and fly through the gaps.">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
<link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#1d1147;--ink:#fff4e0;--hot:#ff5d73;--sun:#ffd166;--mint:#3ee6b0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;touch-action:none}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
canvas{height:100%;max-height:100vh;aspect-ratio:9/14;max-width:100%;background:linear-gradient(#2d1b69,#7a2f7a 70%,#ff8a5b);border-radius:12px}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(29,17,71,.92);border:3px solid var(--sun);border-radius:20px;padding:24px;max-width:340px;max-height:calc(100dvh - 24px);overflow-y:auto;text-align:center}
h1{margin:0 0 6px;font-size:38px;letter-spacing:-1px;color:var(--sun)}
p{margin:8px 0;line-height:1.45}
.instructions{font-size:16px;line-height:1.4}
.instructions strong{color:var(--mint)}
.small{font-size:13px;opacity:.75}
.card a{color:var(--mint)}
.start-links{margin-top:14px;font-size:13px;line-height:1.8}
.start-links a{white-space:nowrap}
button{margin-top:12px;font:inherit;font-weight:700;font-size:18px;padding:12px 26px;border:0;border-radius:999px;background:var(--hot);color:#fff;cursor:pointer}
button.alt{background:var(--mint);color:#16103a}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.big{font-size:44px;font-weight:800;color:var(--mint)}
.hide{display:none!important}
#controls{position:absolute;z-index:2;top:max(12px,env(safe-area-inset-top));right:max(12px,calc((100vw - min(100vw, 100vh * 9 / 14)) / 2 + 12px));display:flex;gap:8px}
#controls button{margin:0;min-height:44px;padding:9px 14px;font-size:15px;background:rgba(29,17,71,.9);border:2px solid var(--sun);color:var(--ink)}
#controls button:active{transform:scale(.97)}
@media(max-width:420px){.card{padding:20px;max-width:min(340px,calc(100vw - 32px))}h1{font-size:32px}#controls{right:10px;top:max(10px,env(safe-area-inset-top))}#controls button{padding:8px 10px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="560"></canvas>
  <div id="ui"><div class="card" id="card"></div></div>
  <div id="controls"><button id="mute" aria-pressed="false">Sound: on</button><button id="pause" class="hide">Pause</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),card=document.getElementById('card');
const W=360,H=560,BX=90,R=14,TOP=40,BOT=H-40;
let audio,analyser,buf,mode='intro',useTouch=false,muted=false;
let lo=48,hi=72,curMidi=null,rms=0,touchY=H/2,pitchHistory=[],lastFrameMidi=null;
let by=H/2,walls=[],score=0,speed=140,lastGapY=H/2,lastT=0,best=+(localStorage.getItem('hrBest')||0);
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName=m=>NOTES[Math.round(m)%12]+(Math.floor(Math.round(m)/12)-1);
const muteButton=document.getElementById('mute'),pauseButton=document.getElementById('pause');
function initAudio(){
  if(!audio){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(AudioCtx)audio=new AudioCtx()}
  if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});
}
function sound(freq,duration,type='sine',volume=.045){
  if(muted)return;
  initAudio();if(!audio)return;
  const osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;
  osc.type=type;osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+duration+.02);
}
function updateMute(){muteButton.textContent=muted?'Sound: off':'Sound: on';muteButton.setAttribute('aria-pressed',String(muted))}
muteButton.addEventListener('click',()=>{muted=!muted;updateMute();if(!muted)initAudio()});

/* ---------- screens ---------- */
function show(html){card.innerHTML=html;document.getElementById('ui').classList.remove('hide')}
function hideUI(){document.getElementById('ui').classList.add('hide')}
function intro(){mode='intro';show(`<h1>Hum Runner</h1><p class="instructions"><strong>How to play</strong><br>Guide the ball through the gaps and avoid the walls. Hum higher to rise, hum lower to descend, and go silent to sink.<br><br><b>With mic:</b> hum your lowest and highest notes when prompted.<br><b>Without mic:</b> drag or touch to steer.</p><p>Best: ${best}</p><p class="small">🔒 Your voice is processed on your device only. Nothing is recorded or uploaded.</p><button id="go">Start and allow mic</button><button class="alt" id="touch">Play without mic</button><nav class="start-links" aria-label="More about Hum Runner"><a href="how-to-play.html">How to play</a> · <a href="faq.html">FAQ</a> · <a href="about.html">About</a> · <a href="privacy.html">Privacy</a> · <a href="contact.html">Contact</a> · <a href="blog/index.html">Blog</a></nav>`);
  document.getElementById('go').onclick=startMic;
  document.getElementById('touch').onclick=()=>{initAudio();useTouch=true;play()}}

async function startMic(){
  let stream;
  try{
    initAudio();
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('Microphone access is unavailable.');
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(!audio)throw new Error('Audio input is unavailable.');
    const src=audio.createMediaStreamSource(stream);
    analyser=audio.createAnalyser();analyser.fftSize=2048;src.connect(analyser);
    buf=new Float32Array(analyser.fftSize);
    calibrate();
  }catch(e){
    if(stream)stream.getTracks().forEach(track=>track.stop());
    const detail=e&&e.name==='NotAllowedError'?'Microphone permission was denied. Allow it in browser settings and try again.':'Could not start the microphone. Check browser permission and use HTTPS or localhost.';
    show(`<h1>Mic unavailable</h1><p>${detail}</p><p>You can still play without a microphone.</p><button id="r">Try again</button><button class="alt" id="t">Play without mic</button>`);
    document.getElementById('r').onclick=startMic;
    document.getElementById('t').onclick=()=>{initAudio();useTouch=true;play()};
  }
}

/* ---------- calibration: low hum, then high hum ---------- */
function calibrate(){
  const got={};
  const step=(label,key,next)=>{
    mode='cal';let left=3,samples=[];
    show(`<h1>${label}</h1><p>Hum steadily for <b id="n">3</b> seconds.</p><div class="big" id="note">--</div>`);
    const tick=setInterval(()=>{left--;document.getElementById('n').textContent=left;
      if(left<=0){clearInterval(tick);clearInterval(poll);
        samples.sort((a,b)=>a-b);
        if(samples.length<8){show(`<h1>Didn't hear you</h1><p>Hum louder and closer to the mic.</p><button id="a">Try again</button>`);document.getElementById('a').onclick=()=>step(label,key,next);return}
        got[key]=samples[Math.floor(samples.length/2)];next()}},1000);
    const poll=setInterval(()=>{const m=detectPitch();if(m!=null){samples.push(m);document.getElementById('note').textContent=noteName(m)}},50);
  };
  step('Hum your lowest note','lo',()=>step('Now hum your highest note','hi',()=>{
    lo=got.lo;hi=got.hi;
    if(hi-lo<4){hi=lo+7}
    lo-=1;hi+=1;play();
  }));
}

/* ---------- pitch detection (autocorrelation) ---------- */
function detectPitch(){
  analyser.getFloatTimeDomainData(buf);
  let e=0;for(let i=0;i<buf.length;i++)e+=buf[i]*buf[i];
  rms=Math.sqrt(e/buf.length);
  if(rms<0.015)return null;
  const sr=audio.sampleRate,minL=Math.floor(sr/1000),maxL=Math.floor(sr/80),c=new Float32Array(maxL+2);
  let max=0;
  for(let l=minL;l<=maxL;l++){let s=0;for(let i=0;i<buf.length-l;i++)s+=buf[i]*buf[i+l];c[l]=s/e;if(c[l]>max)max=c[l]}
  if(max<0.5)return null;
  for(let l=minL+1;l<maxL;l++){
    if(c[l]>=0.85*max&&c[l]>c[l-1]&&c[l]>=c[l+1]){return 69+12*Math.log2((sr/l)/440)}
  }
  return null;
}
function readPitch(){
  const raw=detectPitch();
  if(raw==null){pitchHistory.length=0;lastFrameMidi=null;return null}
  const previous=lastFrameMidi;lastFrameMidi=raw;
  if(previous!=null&&Math.abs(raw-previous)>7)return null;
  pitchHistory.push(raw);if(pitchHistory.length>5)pitchHistory.shift();
  const sorted=[...pitchHistory].sort((a,b)=>a-b);
  return sorted[Math.floor(sorted.length/2)];
}

/* ---------- game ---------- */
function play(){
  mode='play';score=0;speed=140;walls=[];by=H/2;lastGapY=H/2;pitchHistory=[];lastFrameMidi=null;curMidi=null;rms=0;
  pauseButton.classList.remove('hide');
  for(let i=0;i<3;i++)spawn(W+120+i*220);
  hideUI();lastT=performance.now();requestAnimationFrame(loop);
}
function pauseGame(){
  if(mode!=='play')return;
  mode='paused';
  show(`<h1>Paused</h1><p>Take a breath. Your run is safe.</p><button id="resume">Resume</button><button class="alt" id="restart">Restart</button>`);
  document.getElementById('resume').onclick=resumeGame;
  document.getElementById('restart').onclick=play;
}
function resumeGame(){
  if(mode!=='paused')return;
  initAudio();mode='play';hideUI();lastT=performance.now();requestAnimationFrame(loop);
}
function spawn(x){
  const gapH=Math.max(120,190-score*3);
  const lim=190;
  let gy=lastGapY+(Math.random()*2-1)*lim;
  gy=Math.min(BOT-gapH/2,Math.max(TOP+gapH/2,gy));
  lastGapY=gy;walls.push({x,gy,gapH,passed:false});
}
function loop(t){
  if(mode!=='play')return;
  const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  // control
  if(useTouch){by+=(touchY-by)*Math.min(1,dt*10)}
  else{
    const m=readPitch();
    if(m!=null){
      curMidi=m;
      const n=Math.min(1,Math.max(0,(m-lo)/(hi-lo)));
      const target=BOT-n*(BOT-TOP);
      by+=(target-by)*Math.min(1,dt*12);
    }else{curMidi=null;by+=130*dt}
  }
  by=Math.min(BOT+R,Math.max(TOP-R,by));
  // world
  speed=Math.min(300,140+score*4);
  for(const w of walls){
    w.x-=speed*dt;
    if(!w.passed&&w.x+26<BX-R){w.passed=true;score++;sound(880,.12,'sine',.035)}
    if(BX+R>w.x&&BX-R<w.x+26&&(by-R<w.gy-w.gapH/2||by+R>w.gy+w.gapH/2))return over();
  }
  if(walls[0].x<-40){walls.shift();spawn(walls[walls.length-1].x+220)}
  draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // pitch guide
  ctx.strokeStyle='rgba(255,244,224,.12)';ctx.setLineDash([6,10]);
  ctx.beginPath();ctx.moveTo(0,TOP);ctx.lineTo(W,TOP);ctx.moveTo(0,BOT);ctx.lineTo(W,BOT);ctx.stroke();ctx.setLineDash([]);
  for(const w of walls){
    ctx.fillStyle='#ffd166';
    ctx.fillRect(w.x,0,26,w.gy-w.gapH/2);
    ctx.fillRect(w.x,w.gy+w.gapH/2,26,H);
  }
  // trail glow when humming
  ctx.beginPath();ctx.arc(BX,by,R+(curMidi!=null?6:0),0,7);
  ctx.fillStyle=curMidi!=null?'rgba(62,230,176,.35)':'rgba(255,93,115,.25)';ctx.fill();
  ctx.beginPath();ctx.arc(BX,by,R,0,7);ctx.fillStyle='#ff5d73';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#fff4e0';ctx.stroke();
  ctx.fillStyle='#fff4e0';ctx.font='800 40px Trebuchet MS';ctx.textAlign='center';ctx.fillText(score,W/2,70);
  ctx.font='700 14px Trebuchet MS';ctx.textAlign='left';
  ctx.fillText(useTouch?'Drag to move':(curMidi!=null?`${noteName(curMidi)} · hearing`:'Mic · listening'),12,H-18);
  if(!useTouch){
    const level=Math.min(1,rms/.08);ctx.fillStyle='rgba(255,244,224,.25)';ctx.fillRect(12,H-12,116,6);
    ctx.fillStyle=curMidi!=null?'#3ee6b0':'#ffd166';ctx.fillRect(12,H-12,116*level,6);
  }
}
function title(s){return s<3?'Shy Hummer':s<8?'Bathroom Singer':s<15?'Choir Kid':s<25?'Pitch Wizard':'Vocal Legend'}
function over(){
  mode='over';
  pauseButton.classList.add('hide');sound(115,.32,'triangle',.09);
  if(score>best){best=score;try{localStorage.setItem('hrBest',best)}catch(e){}}
  const t=title(score);
  show(`<h1>Game over</h1><div class="big">${score}</div><p>You are a <b>${t}</b>.<br>Best: ${best}</p><button id="a">Play again</button><button class="alt" id="s">Share score</button><button id="home">Home</button>`);
  document.getElementById('a').onclick=play;
  document.getElementById('home').onclick=()=>{useTouch=false;pitchHistory=[];lastFrameMidi=null;curMidi=null;intro()};
  document.getElementById('s').onclick=()=>{
    const txt=`I passed ${score} gaps in Hum Runner using only my voice 🎤 ${t}. Can you beat me? ${location.href}`;
    if(navigator.share)navigator.share({text:txt}).catch(()=>{});
    else navigator.clipboard.writeText(txt).then(()=>{document.getElementById('s').textContent='Copied!'});
  };
}
pauseButton.addEventListener('click',pauseGame);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
window.addEventListener('blur',pauseGame);
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();touchY=(e.clientY-r.top)/r.height*H});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();touchY=(e.clientY-r.top)/r.height*H});
intro();
</script>

</body>
</html>
